<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio de Oportunidades para Nuestro Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E4D8BE;
    --paper-dark: #D9CBA6;
    --card: #FBF8F1;
    --ink: #2B2620;
    --ink-soft: #5c5346;
    --stamp: #A63A2F;
    --teal: #4f6e68;
    --line: #C9B98C;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(43,38,32,0.05) 28px);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height:1.55;
    -webkit-font-smoothing: antialiased;
  }

  .type{ font-family:'Special Elite', monospace; letter-spacing:0.02em; }
